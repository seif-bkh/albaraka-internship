<!-- Bouton flottant -->
<button type="button" class="fab" [class.open]="widget.isOpen()" (click)="toggle()"
        [attr.aria-label]="widget.isOpen() ? ('widget.close' | translate) : ('widget.open' | translate)"
        [title]="widget.isOpen() ? ('widget.close' | translate) : ('widget.open' | translate)">
  <span class="fab-ring" aria-hidden="true"></span>
  <svg class="ico-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
  </svg>
  <svg class="ico-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round">
    <path d="M6 6l12 12M18 6L6 18"/>
  </svg>
</button>

<!-- Panneau de conversation -->
<div class="panel" *ngIf="widget.isOpen()" [attr.dir]="dir" role="dialog" aria-label="{{ 'widget.title' | translate }}">
  <header class="panel-head">
    <span class="head-avatar"><img src="/albaraka.png" alt=""></span>
    <div class="head-titles">
      <strong>{{ 'widget.title' | translate }}</strong>
      <small><span class="live-dot"></span>{{ 'widget.subtitle' | translate }}</small>
    </div>
    <div class="head-langs">
      <button type="button" [class.on]="lang === 'fr'" (click)="setLang('fr')">FR</button>
      <button type="button" [class.on]="lang === 'ar'" (click)="setLang('ar')">ع</button>
      <button type="button" [class.on]="lang === 'en'" (click)="setLang('en')">EN</button>
    </div>
    <button type="button" class="head-close" (click)="close()" [attr.aria-label]="'widget.close' | translate">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </header>

  <div class="panel-body" #scroller>
    <div class="msg" *ngFor="let m of messages" [ngClass]="m.role">
      <ng-container *ngIf="m.role !== 'system'">
        <div class="bubble">
          <span class="txt" [innerHTML]="m.content"></span>
          <span class="not-grounded" *ngIf="m.role === 'assistant' && m.grounded === false && !m.streaming">
            {{ 'chat.notGrounded' | translate }}
          </span>
        </div>
        <span class="meta">{{ m.time }}</span>
      </ng-container>
      <span *ngIf="m.role === 'system'" class="system">{{ m.content }}</span>
    </div>

    <div class="typing" *ngIf="streaming && currentEmpty">
      <span></span><span></span><span></span>
    </div>
  </div>

  <footer class="panel-foot">
    <div class="quota" *ngIf="nombreMessages > 0" [title]="nombreMessages + '/' + messagesLimite + ' ' + ('chat.msg' | translate)">
      <div class="quota-bar"><div class="quota-fill" [style.width.%]="(nombreMessages / messagesLimite) * 100"></div></div>
      <span>{{ nombreMessages }}/{{ messagesLimite }}</span>
    </div>
    <div class="composer">
      <textarea rows="1" [ngModel]="draft" (ngModelChange)="draft = $event" (keydown)="onKeydown($event)"
                [placeholder]="('widget.placeholder' | translate)" [disabled]="limitReached"></textarea>
      <button type="button" class="send" *ngIf="!streaming" (click)="send()" [disabled]="!draft.trim() || limitReached"
              [attr.aria-label]="'chat.send' | translate">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/>
        </svg>
      </button>
      <button type="button" class="send stop" *ngIf="streaming" (click)="stop()" [attr.aria-label]="'chat.stopBtn' | translate">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      </button>
    </div>
    <p class="disclaimer">{{ 'widget.disclaimer' | translate }}</p>
  </footer>
</div>
