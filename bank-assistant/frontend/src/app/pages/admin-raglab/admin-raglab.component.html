<div class="raglab-console">
  <header class="console-head">
    <div class="head-copy">
      <h1>Console RAGLab</h1>
      <p>
        Le moteur qui répond aux clients. Chaque réponse est adossée à un passage du corpus
        et vérifiée mot à mot ; cette console montre ce que le service lit, sert et coûte.
      </p>
    </div>
    <a class="head-link" routerLink="/admin/agent/health">
      Adresse &amp; diagnostic
      <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
      </svg>
    </a>
  </header>

  <app-raglab-status-bar></app-raglab-status-bar>

  <nav class="raglab-nav" aria-label="Écrans de la console RAGLab">
    @if (canRun()) {
      <a routerLink="/admin/raglab/ask" routerLinkActive="active" #askTab="routerLinkActive"
         class="raglab-tab" [attr.aria-current]="askTab.isActive ? 'page' : null">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" stroke="currentColor"
             stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <span>Question fondée</span>
      </a>
    }

    <a routerLink="/admin/raglab/documents" routerLinkActive="active" #docsTab="routerLinkActive"
       class="raglab-tab" [attr.aria-current]="docsTab.isActive ? 'page' : null">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" stroke="currentColor"
           stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
      </svg>
      <span>Corpus</span>
    </a>

    <a routerLink="/admin/raglab/retrieval" routerLinkActive="active" #searchTab="routerLinkActive"
       class="raglab-tab" [attr.aria-current]="searchTab.isActive ? 'page' : null">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" stroke="currentColor"
           stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <span>Recherche</span>
    </a>

    @if (canManage()) {
      <a routerLink="/admin/raglab/settings" routerLinkActive="active" #settingsTab="routerLinkActive"
         class="raglab-tab" [attr.aria-current]="settingsTab.isActive ? 'page' : null">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" stroke="currentColor"
             stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span>Réglages</span>
      </a>

      <a routerLink="/admin/raglab/evaluations" routerLinkActive="active" #evalTab="routerLinkActive"
         class="raglab-tab" [attr.aria-current]="evalTab.isActive ? 'page' : null">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" stroke="currentColor"
             stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/>
        </svg>
        <span>Évaluations</span>
      </a>
    }
  </nav>

  <main class="raglab-screen-content">
    <router-outlet></router-outlet>
  </main>
</div>
