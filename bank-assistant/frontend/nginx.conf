server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hide the nginx version and set browser hardening headers (6.2). `always`
    # keeps them on error responses too. CSP allows inline styles because
    # Angular emits component styles inline; scripts stay same-origin only.
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Uploaded/served documents can be large.
    client_max_body_size 50M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Proxy API traffic to the Spring Boot backend. Because the browser only
    # ever talks to this origin, there is no cross-origin request and hence
    # no CORS preflight at all.
    location /api/ {
        proxy_pass         http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # AI responses are slow; allow generous read timeouts.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering       off;
    }

    # Angular is a single-page app: unknown paths must fall back to index.html
    # so client-side routing (/chat, /dashboard, ...) works on hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The SPA entry point must NEVER be cached: a stale index.html references
    # hashed assets (styles-*.css, main-*.js) from a previous build that no
    # longer exist after a rebuild → 404 on the stylesheet → unstyled app while
    # component styles (injected by JS) still apply. `no-cache` (revalidate
    # every time) costs one conditional request per visit and prevents that
    # whole class of failure. Applies to direct /index.html AND to the
    # try_files fallback above (internal redirects re-run location matching).
    # NOTE: adding a header here discards the server-level ones — repeat them.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # Long-lived caching for fingerprinted build assets.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        # NOTE: a nested add_header discards the server-level ones, so repeat them.
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
    }
}
