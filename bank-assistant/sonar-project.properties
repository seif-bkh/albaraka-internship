# SonarQube analysis — what is indexed, and how to run it
#
# This file is read by the scanner (docker run ... sonarsource/sonar-scanner-cli,
# `mvn sonar:sonar`, or the CI job) and by SonarQube itself. Values that differ per
# environment (host URL, token) are NEVER in here — they come from the environment.
#
# Keys for SonarCloud live in docs/SONAR.md §3; for a self-hosted server, create the
# project once from the UI and set sonar.projectKey to what it shows.

sonar.projectKey=bank-assistant
sonar.projectName=Al Baraka Bank Assistant
sonar.projectVersion=1.0

# One project, two languages: the Spring Boot edge and the Angular SPA. RAGLab is a
# separate service with its own repository, so nothing of it is indexed here.
sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java,frontend/src
sonar.sourceEncoding=UTF-8

# Java: compiled classes are needed for bytecode analysis (the pom builds them).
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.java.source=21

# Unit tests and specs are tests, not source.
sonar.test.inclusions=backend/src/test/java/**/*.java,frontend/src/**/*.spec.ts

# Generated, vendored and non-product material.
sonar.exclusions=\
  frontend/node_modules/**,\
  frontend/.angular/**,\
  frontend/dist/**,\
  frontend/public/**,\
  backend/target/**,\
  documents/**,\
  **/*.min.js,\
  **/*.min.css

sonar.coverage.exclusions=\
  backend/src/main/java/com/albaraka/backend/dto/**,\
  backend/src/main/java/com/albaraka/backend/model/**,\
  backend/src/main/java/com/albaraka/backend/dev/**,\
  frontend/src/**/*.spec.ts,\
  frontend/src/main.ts

# Coverage produced by the two test runners: JaCoCo XML (backend) and
# Istanbul/Vitest lcov (frontend), both relative to this file.
#
# The lcov file is written by the Angular builder with paths relative to
# frontend/ (SF:src/app/...). Run scripts/lcov-rebase.sh after the tests, or the
# JavaScript coverage is silently dropped and the dashboard shows 0%.
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/frontend/lcov.info

# The same rules the product already lives by, so the scanner does not re-litigate
# architecture in a dashboard nobody reads: Cypress/Playwright absent, and the
# seeded dev fixture is excluded because it exists only behind DEV_SEED.
sonar.cpd.exclusions=frontend/src/**/*.spec.ts,backend/src/test/**

# Nothing to analyze in these.
sonar.scm.exclusions.disabled=false
